<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .home-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1E293B 0%, #334155 45%, #4F6EF7 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .home-page::before {
            content: ''; position: absolute; width: 700px; height: 700px;
            background: rgba(79,110,247,0.12); border-radius: 50%; top: -300px; right: -200px;
        }
        .home-page::after {
            content: ''; position: absolute; width: 500px; height: 500px;
            background: rgba(79,110,247,0.08); border-radius: 50%; bottom: -200px; left: -150px;
        }
        .home-container { position: relative; z-index: 1; text-align: center; max-width: 600px; padding: 20px; }
        .home-logo {
            width: 90px; height: 90px; background: white; border-radius: 24px; margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .home-logo svg { width: 48px; height: 48px; fill: #4F6EF7; }
        .home-container h1 { color: white; font-size: 40px; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px; }
        .home-container .subtitle { color: rgba(255,255,255,0.7); font-size: 17px; margin-bottom: 48px; }
        .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .home-card {
            background: white; border-radius: 16px; padding: 36px 28px; text-decoration: none;
            transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .home-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.25); }
        .home-card .card-icon {
            width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
        }
        .home-card .card-icon.admin { background: #1E293B; color: white; }
        .home-card .card-icon.reader { background: #4F6EF7; color: white; }
        .home-card .card-icon svg { width: 28px; height: 28px; }
        .home-card h3 { font-size: 18px; color: #1E293B; margin: 0; }
        .home-card p { font-size: 13px; color: #64748B; margin: 0; }
        .home-footer { position: relative; z-index: 1; margin-top: 48px; color: rgba(255,255,255,0.5); font-size: 13px; }
        @media (max-width: 500px) {
            .home-cards { grid-template-columns: 1fr; }
            .home-container h1 { font-size: 28px; }
        }
    </style>
</head>
<body class="home-page">
    <div class="home-container">
        <div class="home-logo">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#4F6EF7" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="#4F6EF7" font-weight="bold">书</text></svg>
        </div>
        <h1>图书馆管理系统</h1>
        <p class="subtitle">Library Management System</p>
        <div class="home-cards">
            <a href="/login" class="home-card">
                <div class="card-icon admin">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>
                </div>
                <h3>管理员入口</h3>
                <p>图书管理 · 读者管理 · 借阅操作</p>
            </a>
            <a href="/reader" class="home-card">
                <div class="card-icon reader">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <h3>读者入口</h3>
                <p>注册账户 · 浏览图书 · 借还书</p>
            </a>
        </div>
    </div>
    <div class="home-footer">开放图书馆 · 让知识自由流动</div>
</body>
</html>
