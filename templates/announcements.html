{% extends "base.html" %}
{% block title %}公告管理 - 图书馆管理系统{% endblock %}
{% set active_page = 'announcements' %}
{% block page_title %}公告管理{% endblock %}

{% block content %}
<div class="panel">
    <div class="toolbar">
        <span class="panel-title" style="font-size:16px;">图书馆公告</span>
        <button class="btn btn-primary" onclick="openAddModal()">+ 发布公告</button>
    </div>
    <div class="panel-body" style="padding:16px 24px;">
        <div id="annList"></div>
    </div>
    <div id="annPagination"></div>
</div>

<div class="modal-overlay" id="annModal" style="display:none;">
    <div class="modal">
        <div class="modal-header"><h3>发布公告</h3><button class="modal-close" onclick="closeModal('annModal')">&times;</button></div>
        <form id="annForm">
            <div class="modal-body">
                <div class="form-group"><label>标题 *</label><input type="text" id="annTitle" required placeholder="公告标题"></div>
                <div class="form-group"><label>内容 *</label><textarea id="annContent" rows="5" required placeholder="公告内容..."></textarea></div>
                <div class="form-group"><label><input type="checkbox" id="annPinned" value="1"> 置顶公告</label></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('annModal')">取消</button>
                <button type="submit" class="btn btn-primary">发布</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1; const pageSize = 10;

async function loadAnnouncements(page = 1) {
    currentPage = page;
    const data = await api(`/api/announcements?page=${page}&page_size=${pageSize}`);
    if (!data.success) { showToast(data.message, 'error'); return; }
    const container = document.getElementById('annList');
    if (data.data.length === 0) {
        container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg><p>暂无公告</p></div>';
    } else {
        container.innerHTML = data.data.map(a => `
            <div style="padding:16px 0; border-bottom:1px solid var(--gray-100); ${a.is_pinned ? 'background:var(--warning-50);padding:16px;border-radius:8px;margin-bottom:8px;' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:start;">
                    <h4 style="margin:0;color:var(--gray-800);">${a.is_pinned ? '📌 ' : ''}${esc(a.title)}</h4>
                    <button class="btn btn-danger btn-xs" onclick="deleteAnn(${a.id})">删除</button>
                </div>
                <p style="margin:8px 0 4px;color:var(--gray-600);white-space:pre-wrap;">${esc(a.content)}</p>
                <span style="font-size:12px;color:var(--gray-400);">${esc(a.publisher_name || '')} · ${(a.created_at||'').substring(0,16)}</span>
            </div>
        `).join('');
    }
    renderPagination(document.getElementById('annPagination'), currentPage, Math.ceil(data.total/pageSize), data.total, loadAnnouncements);
}

function openAddModal() { document.getElementById('annForm').reset(); openModal('annModal'); }

async function deleteAnn(id) {
    if (!confirm('确定删除该公告吗？')) return;
    const data = await api(`/api/announcements/${id}`, {method:'DELETE'});
    showToast(data.message, data.success?'success':'error');
    if (data.success) loadAnnouncements(currentPage);
}

document.getElementById('annForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const body = { title: document.getElementById('annTitle').value.trim(), content: document.getElementById('annContent').value.trim(), is_pinned: document.getElementById('annPinned').checked ? 1 : 0 };
    const data = await api('/api/announcements', {method:'POST', body:JSON.stringify(body)});
    showToast(data.message, data.success?'success':'error');
    if (data.success) { closeModal('annModal'); loadAnnouncements(currentPage); }
});

loadAnnouncements();
</script>
{% endblock %}
